version: "3.8"

networks:
  # Public / Host-facing network for web console and control API
  bayora-control-net:
    driver: bridge
    name: bayora-control-net

  # Isolated Red Team network (Red sandbox <-> Gateway ONLY)
  bayora-red-net:
    driver: bridge
    internal: true
    name: bayora-red-net

  # Isolated Blue Team network (Blue defense <-> Gateway ONLY)
  bayora-blue-net:
    driver: bridge
    internal: true
    name: bayora-blue-net

  # Isolated Model Sandbox network (Gateway <-> Model ONLY)
  bayora-model-net:
    driver: bridge
    internal: true
    name: bayora-model-net

  # Isolated Audit & Storage network
  bayora-audit-net:
    driver: bridge
    internal: true
    name: bayora-audit-net

services:
  # Policy Enforcing Gateway: The strictly controlled single-point bridge
  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    container_name: bayora-gateway
    restart: unless-stopped
    read_only: true
    networks:
      - bayora-control-net
      - bayora-red-net
      - bayora-blue-net
      - bayora-model-net
      - bayora-audit-net
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run/secrets:size=4M,noexec,nosuid,nodev,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    environment:
      - BAYORA_SERVICE=gateway
      - BAYORA_GATEWAY_PORT=8080
      - BAYORA_MODEL_HOST=model-sandbox
      - BAYORA_MODEL_PORT=8002
      - BAYORA_CONTROL_HOST=control-plane
      - BAYORA_CONTROL_PORT=8000

  # Red Team Adversarial Sandbox
  red-sandbox:
    build:
      context: ..
      dockerfile: infra/Dockerfile.control
    container_name: bayora-red-sandbox
    restart: unless-stopped
    read_only: true
    networks:
      - bayora-red-net
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run/secrets:size=4M,noexec,nosuid,nodev,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
          pids: 80
    environment:
      - BAYORA_SERVICE=red_runner
      - BAYORA_GATEWAY_URL=http://gateway:8080
    command: ["python", "-m", "bayora.runner", "--tenant", "red"]

  # Blue Team Defense Sandbox
  blue-sandbox:
    build:
      context: ..
      dockerfile: infra/Dockerfile.control
    container_name: bayora-blue-sandbox
    restart: unless-stopped
    read_only: true
    networks:
      - bayora-blue-net
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run/secrets:size=4M,noexec,nosuid,nodev,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
          pids: 80
    environment:
      - BAYORA_SERVICE=blue_runner
      - BAYORA_GATEWAY_URL=http://gateway:8080
    command: ["python", "-m", "bayora.runner", "--tenant", "blue"]

  # Model Under Test Sandbox (Clean isolated inference execution)
  model-sandbox:
    build:
      context: ..
      dockerfile: infra/Dockerfile.control
    container_name: bayora-model-sandbox
    restart: unless-stopped
    read_only: true
    networks:
      - bayora-model-net
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /run/secrets:size=4M,noexec,nosuid,nodev,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
          pids: 100
    environment:
      - BAYORA_SERVICE=model_engine
      - BAYORA_MODEL_PORT=8002
    command: ["python", "-m", "bayora.llm.mock_engine", "--port", "8002"]

  # Central Control Plane API & Audit Orchestrator
  control-plane:
    build:
      context: ..
      dockerfile: infra/Dockerfile.control
    container_name: bayora-control-plane
    restart: unless-stopped
    read_only: true
    ports:
      - "8000:8000"
    networks:
      - bayora-control-net
      - bayora-audit-net
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /run/secrets:size=4M,noexec,nosuid,nodev,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    environment:
      - BAYORA_ENV=production
      - BAYORA_GATEWAY_URL=http://gateway:8080
    command: ["uvicorn", "bayora.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Web Console Next.js Application
  web-console:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bayora-web-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - bayora-control-net
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - control-plane
